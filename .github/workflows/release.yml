name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; bin=linssi; [ "$os" = windows ] && bin=linssi.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/ashishra0/linssi/cli.Version=${GITHUB_REF_NAME#v}" -o "$bin" ./cmd/linssi
            tar -czf "dist/linssi-$os-$arch.tar.gz" "$bin"; rm "$bin"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

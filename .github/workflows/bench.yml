name: bench
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Local fixtures only: live sites are flaky by nature. Iris isn't installed on the runner.
      - run: go run ./bench -tools linssi -out bench-out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench-out/
